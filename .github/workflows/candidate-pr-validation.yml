name: Candidate PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

      - name: Run typecheck
        run: npm run typecheck --if-present

      - name: Run build
        run: npm run build --if-present

      - name: Run tests
        run: npm test

      - name: Check challenge requirements
        run: |
          test -f README.md
          test -f AI_USAGE.md
          grep -R "classify" src tests README.md

      - name: Create review summary
        if: always()
        run: |
          echo "## Cami PR Review Bot" > review.md
          echo "" >> review.md
          echo "### Automated checks" >> review.md
          echo "- Dependencies installed" >> review.md
          echo "- Lint executed if configured" >> review.md
          echo "- Typecheck executed if configured" >> review.md
          echo "- Build executed if configured" >> review.md
          echo "- Tests executed" >> review.md
          echo "- README.md checked" >> review.md
          echo "- AI_USAGE.md checked" >> review.md
          echo "- Classification feature references checked" >> review.md
          echo "" >> review.md
          echo "### Human reviewer focus" >> review.md
          echo "Please review correctness, simplicity, validation, test quality, maintainability, security, product judgement, and AI usage." >> review.md

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
