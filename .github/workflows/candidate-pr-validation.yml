name: Candidate PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cami
          POSTGRES_PASSWORD: cami
          POSTGRES_DB: cami
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cami -d cami"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://cami:cami@localhost:5432/cami

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

      - name: Run typecheck
        run: npm run typecheck --if-present

      - name: Run tests
        run: npm test

      - name: Run migrations
        run: npm run migration:run

      - name: Run build
        run: npm run build --if-present

      - name: Check challenge requirements
        run: |
          test -f README.md
          test -f AI_USAGE.md
          test -f DECISIONS.md
          test -d apps/api
          test -d apps/web
          grep -R "classify" apps README.md

      - name: Create review summary
        if: always()
        run: |
          echo "## Cami PR Review Bot" > review.md
          echo "" >> review.md
          echo "### Automated checks" >> review.md
          echo "- Dependencies installed" >> review.md
          echo "- Lint executed if configured" >> review.md
          echo "- Typecheck executed if configured" >> review.md
          echo "- Tests executed" >> review.md
          echo "- Migrations executed" >> review.md
          echo "- Build executed if configured" >> review.md
          echo "- README.md / AI_USAGE.md / DECISIONS.md checked" >> review.md
          echo "- Monorepo apps (api + web) present" >> review.md
          echo "- Classification feature references checked" >> review.md
          echo "" >> review.md
          echo "### Human reviewer focus" >> review.md
          echo "Please review judgement, correctness, Nest/Next idioms, performance, UI freshness, CI fixes, layering, history slice, test quality, security, and AI usage notes." >> review.md

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
